name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow can read code and nothing else.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  harness:
    name: Harness checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: No secret files are tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\.[^/]+)?|.*\.pem|.*\.key|credentials.*\.json|service-account.*\.json)$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Secret-like files are tracked:"; echo "$bad"; exit 1; fi
      - name: No risky workflow triggers
        run: |
          # pull_request_target runs with secrets on code from forks. Never use it in a public repo.
          if grep -rnE 'pull_request_target|workflow_run' .github/workflows/; then exit 1; fi
      - name: Settings and MCP config are valid JSON
        run: |
          python3 -m json.tool .claude/settings.json > /dev/null
          python3 -m json.tool .mcp.json > /dev/null
      - name: Guard hook tests
        run: uv run --with pytest python -m pytest -q tests/harness
      - name: MCP server tests
        working-directory: mcp_servers/cfbd
        run: uv run --extra dev python -m pytest -q
