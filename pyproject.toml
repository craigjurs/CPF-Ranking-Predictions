[project]
name = "cfp-rankings"
version = "0.1.0"
description = "Predict weekly AP, Coaches and CFP top 25 polls."
requires-python = ">=3.11"
# The models so far are pure Python. `mcp` is only needed to pull data,
# because pulls go through the repo's CFBD MCP server.
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfp_rankings"]

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
