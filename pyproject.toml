[project]
name = "cfp-rankings"
version = "0.1.0"
description = "Predict weekly AP, Coaches and CFP top 25 polls."
requires-python = ">=3.11"
# `mcp` is only needed to pull data, because pulls go through the repo's CFBD
# MCP server. numpy and LightGBM power the Stage 1 and Stage 2 models; the
# naive baselines run without them.
dependencies = ["mcp>=2.3,<3", "numpy>=2", "lightgbm>=4.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfp_rankings"]

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
