[project]
name = "cfbd-mcp"
version = "0.1.0"
description = "Read-only MCP server for the CollegeFootballData API. The API key stays inside this process; agents only ever see data."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
cfbd-mcp = "cfbd_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfbd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
