# Install once:  pip install pre-commit  (or: uv tool install pre-commit)
#                pre-commit install
# Then every `git commit` is scanned before it is created.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: forbid-env-files
        name: Block .env and credential files
        entry: "Refusing to commit a secrets file. Keep secrets in your vault (docs/security/setup-your-key.md)."
        language: fail
        files: '(^|/)(\.env(\.(?!example$)[^/]+)?|.*\.pem|.*\.key|credentials.*\.json|service-account.*\.json)$'
